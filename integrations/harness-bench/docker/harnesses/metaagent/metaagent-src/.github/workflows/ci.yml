name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python }}
      # Keep the upstream wheel's deeply nested build paths below Windows limits.
      UV_CACHE_DIR: ${{ runner.temp }}/ma-uv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Sync locked dependencies
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Lint, type check, tests and build
        run: uv run --locked python scripts/check.py --build
      - name: Verify wheel in a separate environment
        run: uv run --locked python scripts/verify_wheel.py

  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meta_agent
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: meta_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta_agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      META_AGENT_TEST_POSTGRES_DSN: postgresql://meta_agent:local-ci-only@localhost:5432/meta_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.19
      - run: uv sync --locked --extra postgres
      - run: uv run --locked --extra postgres pytest tests/integration/test_postgres_recovery.py
